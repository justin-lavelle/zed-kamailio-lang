#!KAMAILIO
#
# Sample Kamailio configuration used to test the Zed language extension.
# This file intentionally exercises a wide range of syntax features.
#

####### Include Local Config If Exists #########
import_file "kamailio-local.cfg"

####### Defined Values #########
#!define WITH_DEBUG
#!define DBURL "mysql://kamailio:kamailiorw@localhost/kamailio"
#!define MULTIDOMAIN 0
#!define FLT_ACC 1
#!define FLT_ACCMISSED 2

# `#!trydefine` and `#!redef` are synonyms for `#!trydef` / `#!redefine`.
#!trydefine   FLT_NATS 5
#!redef       MULTIDOMAIN 1

# Pull values from environment variables instead of hard-coding them.
#!defenv      DBHOST
#!defenvs     DBHOST
#!trydefenv   DBHOST
#!trydefenvs  DBHOST

# Compute macros from arbitrary expressions.
#!defexp      MAX_CONN 100 * 2
#!defexps     WELCOME  "hello"

#!ifexp       MAX_CONN > 100
children=8
#!else
children=4
#!endif

#!ifdef WITH_DEBUG
debug=4
log_stderror=yes
#!else
debug=2
log_stderror=no
#!endif

memdbg=5
memlog=5

log_facility=LOG_LOCAL0
log_prefix="{$mt $hdr(CSeq) $ci}"

fork=yes
children=4

/* uncomment to listen on a specific interface */
#listen=udp:10.0.0.10:5060
port=5060

tcp_connection_lifetime=3605

####### Modules Section ########
loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "acc.so"

# ----- module parameters -----
modparam("jsonrpcs", "pretty_format", 1)
modparam("tm", "failure_reply_mode", 3)
modparam("tm", "fr_timer", 30000)
modparam("rr", "enable_full_lr", 1)
modparam("registrar", "method_filtering", 1)
modparam("registrar", "max_expires", 3600)
modparam("acc", "log_flag", FLT_ACC)
modparam("acc", "log_missed_flag", FLT_ACCMISSED)
modparam("acc", "log_extra",
    "src_user=$fU;src_domain=$fd;src_ip=$si;"
    "dst_ouser=$tU;dst_user=$rU;dst_domain=$rd")

####### Routing Logic ########

####### Pseudo-variable showcase ########
# All of the following are pseudo-variables — runtime values prefixed
# with a `$` sigil. The whole `$…` expression is highlighted as a
# builtin variable; user-named portions inside container pvars are
# given a distinct colour.
#
#   Bare built-ins ........... $rU $fU $tU $si $ci $T_branch_idx
#   User-named containers .... $var(x) $avp(rcv) $dlg_var(key) $shv(counter)
#   Hash table ............... $sht(ipban=>$si)
#   Header lookup ............ $hdr(From), $hdr(P-Asserted-Identity)
#   xavp with index/field .... $xavp(node[0]=>field)
#   Transformations .......... $rU{s.tolower}, $rU{s.tolower}{s.len},
#                              $(rU{s.tolower})
#   Transaction helpers ...... $T_req(From), $T_rpl(To), $T_branch_idx
#   Null sentinel ............ $null / $NULL

# Main SIP request routing logic
request_route {
    # per request initial checks
    route(REQINIT);

    # Transformations with quoted string arguments (regression test:
    # the embedded `"` used to confuse the highlighter).
    $du = $(var(received){s.rm, '"'});
    $var(host) = $(var(uri){s.after, '@'});
    $var(scheme) = $(var(uri){s.before, ':'});
    $var(swap) = $(var(name){s.replace, "old", "new"});


    # CANCEL processing
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    # handle retransmissions
    if (!is_method("ACK")) {
        if (t_precheck_trans()) {
            t_check_trans();
            exit;
        }
        t_check_trans();
    }

    route(WITHINDLG);
    route(AUTH);

    # account only INVITEs
    if (is_method("INVITE")) {
        setflag(FLT_ACC);
    }

    route(LOCATION);
}

route[RELAY] {
    if (is_method("INVITE|BYE|SUBSCRIBE|UPDATE")) {
        if (!t_is_set("branch_route")) t_on_branch("MANAGE_BRANCH");
    }
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

route[REQINIT] {
    if (src_ip != myself) {
        if ($sht(ipban=>$si) != $null) {
            xdbg("request from blocked IP - $rm from $fu (IP:$si:$sp)\n");
            exit;
        }
    }
    if ($ua =~ "friendly-scanner") {
        sl_send_reply("200", "OK");
        exit;
    }
}

route[LOCATION] {
    if (!lookup("location")) {
        $var(rc) = $rc;
        t_newtran();
        switch ($var(rc)) {
            case -1:
            case -3:
                send_reply("404", "Not Found");
                exit;
            case -2:
                send_reply("405", "Method Not Allowed");
                exit;
        }
    }
    route(RELAY);
    exit;
}

route[WITHINDLG] {
    if (!has_totag()) return;
    if (loose_route()) {
        route(RELAY);
        exit;
    }
    sl_send_reply("404", "Not here");
    exit;
}

route[AUTH] {
    return;
}

branch_route[MANAGE_BRANCH] {
    xdbg("new branch [$T_branch_idx] to $ru\n");
}

onreply_route[MANAGE_REPLY] {
    xdbg("incoming reply\n");
    if (status =~ "[12][0-9][0-9]") {
        route(NATMANAGE);
    }
}

failure_route[MANAGE_FAILURE] {
    if (t_is_canceled()) {
        exit;
    }
}
