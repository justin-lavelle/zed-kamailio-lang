name = "Kamailio"
grammar = "kamailio_cfg"
path_suffixes = ["kamailio", "kamailio.cfg"]
line_comments = ["# ", "// "]
block_comment = ["/* ", " */"]
autoclose_before = ";:.,=}])>"
first_line_pattern = '^#!(KAMAILIO|SER|SIP-ROUTER|OPENSER|MAXCOMPAT|ALL)\b'

brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "/*", end = " */", close = true, newline = false, not_in = ["comment", "string"] },
]
